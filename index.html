<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多次元立方体（超立方体）ジェネレーター</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh; /* height から min-height に変えて、下に引っ張れる余裕を作ります */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            overflow-y: auto; /* ★お待たせしました！画面全体の縦スクロールを解禁！ */
        }
        .controls {
            margin-bottom: 20px;
            z-index: 10;
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .controls input {
            padding: 8px;
            font-size: 16px;
            width: 60px;
            text-align: center;
            background: #222;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
        }
        .btn-pause {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-pause.playing {
            background-color: #2ed573;
        }
        .btn-pause:hover {
            opacity: 0.9;
        }
        canvas {
            background-color: #111;
            max-width: 100%;
            max-height: 75vh;
            height: auto;
        }
    </style>
</head>
<body>

    <div class="controls" style="flex-direction: column; align-items: flex-start; padding: 15px; width: 450px; max-width: 90vw;">
        <div style="display: flex; align-items: center; gap: 15px; width: 100%;">
            <div>
                <label for="dimInput">描画する次元数 (N-Dimension): </label>
                <input type="number" id="dimInput" value="4" min="1">
            </div>
            <button id="pauseBtn" class="btn-pause playing">一時停止</button>
            <button id="resetSlidersBtn" style="padding: 8px 16px; font-size: 14px; font-weight: bold; background-color: #ffa500; color: white; border: none; border-radius: 4px; cursor: pointer;">回転リセット</button>
        </div>
        <!-- 高さを120px〜150pxほどしっかり確保し、はみ出た分だけをスクロールできるようにしました！ -->
        <div id="sliderContainer" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; width: 100%; max-height: 150px; overflow-y: auto; font-size: 13px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 10px;"></div>
    </div>

    <canvas id="glCanvas" width="500" height="500"></canvas>

    <script>
        const canvas = document.getElementById('glCanvas');
        const ctx = canvas.getContext('2d');
        const dimInput = document.getElementById('dimInput');
        const pauseBtn = document.getElementById('pauseBtn');

        let currentDim = parseInt(dimInput.value) || 4;
        let previousDim = currentDim; 
        let vertices = [];
        let edges = [];
        let angles = []; 
        let autoScaleFactor = 400; 
        let isPlaying = true; 

        function generateHypercube(dim) {
            vertices = [];
            edges = [];
            if (dim < 1) return;

            const numVertices = Math.pow(2, dim);
            for (let i = 0; i < numVertices; i++) {
                let v = [];
                for (let d = 0; d < dim; d++) {
                    v.push((i >> d) & 1 ? 1 : -1);
                }
                vertices.push(v);
            }

            for (let i = 0; i < numVertices; i++) {
                for (let j = i + 1; j < numVertices; j++) {
                    let diff = i ^ j;
                    if (diff && (diff & (diff - 1)) === 0) {
                        edges.push([i, j]);
                    }
                }
            }

            angles = [];
            const numPlanes = (dim * (dim - 1)) / 2;
            for (let i = 0; i < numPlanes; i++) {
                angles.push(0);
            }

            // ★★★ 各面の回転速度（強さ）を管理する配列を新設 ★★★
            // 初期状態はそれぞれ少しずつ違うスピードを持たせておきます
            let activePlanes = [];
            const standardAxes = ['X', 'Y', 'Z', 'W', 'V', 'U', 'T', 'S', 'R', 'Q', 'P', 'O', 'N', 'M', 'L', 'K', 'J', 'I', 'H', 'G', 'F', 'E', 'D', 'C', 'B', 'A'];
            const getAxisLabel = (index) => {
                return index < standardAxes.length ? standardAxes[index] : `x${index + 1}`;
            };

            for (let d1 = 0; d1 < dim; d1++) {
                for (let d2 = d1 + 1; d2 < dim; d2++) {
                    activePlanes.push(`${getAxisLabel(d1)}-${getAxisLabel(d2)}`);
                }
            }

            // 操作パネル（入力欄）を画面に作り出す処理
            const container = document.getElementById('sliderContainer');
            if (container) {
                container.innerHTML = ''; // 一旦クリア
                
                // 初回だけ初期スピードをセット（すでにデータがある場合はそれを引き継ぐ！）
                if (!window.currentPlaneSpeeds || window.currentPlaneSpeeds.length !== numPlanes) {
                    window.currentPlaneSpeeds = [];
                    for (let i = 0; i < numPlanes; i++) {
                        window.currentPlaneSpeeds.push(0.01 * (0.5 + (i * 0.1)));
                    }
                }

                activePlanes.forEach((name, idx) => {
                    const wrapper = document.createElement('div');
                    wrapper.style.display = 'flex';
                    wrapper.style.alignItems = 'center';
                    wrapper.style.gap = '5px';
                    wrapper.style.padding = '5px 0';

                    // 現在保持している正しい数値を初期値として表示
                    const currentVal = (window.currentPlaneSpeeds[idx] * 100).toFixed(1);

                    wrapper.innerHTML = `
                        <span style="width: 50px; text-align: right; color: #2ed573; font-weight: bold;">${name}:</span>
                        <input type="number" id="speedInput_${idx}" value="${currentVal}" step="0.1" style="width: 60px; padding: 4px; background: #222; color: #fff; border: 1px solid #555; border-radius: 4px; text-align: center;">
                    `;
                    container.appendChild(wrapper);

                    const inputField = wrapper.querySelector(`#speedInput_${idx}`);
                    
                    // 【重要】入力された瞬間に、即座に裏の計算データへ更新を反映させる
                    inputField.addEventListener('input', (e) => {
                        let val = parseFloat(e.target.value);
                        if (isNaN(val)) val = 0; 
                        window.currentPlaneSpeeds[idx] = val / 100; // ここで裏の力を完全更新！
                    });
                });
            }

            // 回転リセットボタンの動作（最初の自動回転スピードへ完全同期リセット）
            const resetBtn = document.getElementById('resetSlidersBtn');
            if (resetBtn) {
                resetBtn.onclick = () => {
                    if (window.currentPlaneSpeeds) {
                        for (let i = 0; i < numPlanes; i++) {
                            const initialSpeed = 0.01 * (0.5 + (i * 0.1));
                            window.currentPlaneSpeeds[i] = initialSpeed; // 裏のデータをリセット
                            
                            const inputField = document.getElementById(`speedInput_${i}`);
                            if (inputField) inputField.value = (initialSpeed * 100).toFixed(1); // 画面の表示もリセット
                        }
                    }
                };
            }

            let maxRawDist = 0;
            for (let v of vertices) {
                let current = [...v];
                for (let d = dim; d > 3; d--) {
                    const distance = 3.0; 
                    const w = current[d - 1];
                    const factor = 1 / (distance - w);
                    let next = [];
                    for (let i = 0; i < d - 1; i++) {
                        next.push(current[i] * factor);
                    }
                    current = next;
                }
                const distance3D = 3.5;
                // 【バグ修正】配列のインデックス指定[2]を確実に修正しました
                const z = current[2] !== undefined ? current[2] : 0; 
                const factor3D = 1 / (distance3D - z);
                
                const rx = (current[0] || 0) * factor3D;
                const ry = (current[1] || 0) * factor3D;
                const dist = Math.sqrt(rx * rx + ry * ry);
                if (dist > maxRawDist) maxRawDist = dist;
            }
            
            autoScaleFactor = maxRawDist > 0 ? 180 / maxRawDist : 400;
        }

        function rotateND(v, dim) {
            let rotated = [...v];
            let angleIndex = 0;

            for (let d1 = 0; d1 < dim; d1++) {
                for (let d2 = d1 + 1; d2 < dim; d2++) {
                    const theta = angles[angleIndex] * (0.5 + (angleIndex * 0.1));
                    const cos = Math.cos(theta);
                    const sin = Math.sin(theta);

                    const x = rotated[d1];
                    const y = rotated[d2];

                    rotated[d1] = x * cos - y * sin;
                    rotated[d2] = x * sin + y * cos;

                    angleIndex++;
                }
            }
            return rotated;
        }

        function project(v, dim) {
            let current = [...v];
            
            for (let d = dim; d > 3; d--) {
                const distance = 3.0; 
                const w = current[d - 1];
                const factor = 1 / (distance - w);
                
                let next = [];
                for (let i = 0; i < d - 1; i++) {
                    next.push(current[i] * factor);
                }
                current = next;
            }

            const distance3D = 3.5;
            // 【バグ修正】ここも配列のインデックス指定[0],[1],[2]を徹底して直しました
            const z = current[2] !== undefined ? current[2] : 0; 
            const factor3D = 1 / (distance3D - z);
            
            const x2d = (current[0] || 0) * factor3D * autoScaleFactor + canvas.width / 2;
            const y2d = (current[1] || 0) * factor3D * autoScaleFactor + canvas.height / 2;

            return { x: x2d, y: y2d };
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isPlaying && window.currentPlaneSpeeds) {
                for (let i = 0; i < angles.length; i++) {
                    // 固定値の0.01ではなく、バーで設定したスピード（強さ）を足す！
                    angles[i] += window.currentPlaneSpeeds[i] || 0;
                }
            }

            const projectedVertices = vertices.map(v => {
                const rotated = rotateND(v, currentDim);
                return project(rotated, currentDim);
            });

            if (currentDim >= 8) {
                ctx.strokeStyle = 'rgba(0, 255, 200, 0.15)';
                ctx.lineWidth = 0.5;
            } else if (currentDim >= 6) {
                ctx.strokeStyle = 'rgba(0, 255, 200, 0.3)';
                ctx.lineWidth = 0.8;
            } else {
                ctx.strokeStyle = 'rgba(0, 255, 200, 0.7)';
                ctx.lineWidth = 1.5;
            }
            
            for (let edge of edges) {
                const p1 = projectedVertices[edge[0]];
                const p2 = projectedVertices[edge[1]];
                
                if (p1 && p2) {
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            }

            ctx.fillStyle = '#ff4757';
            const dotRadius = currentDim >= 8 ? 1 : (currentDim >= 6 ? 2 : 4);
            for (let p of projectedVertices) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, dotRadius, 0, Math.PI * 2);
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        pauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                pauseBtn.innerText = '一時停止';
                pauseBtn.classList.add('playing');
            } else {
                pauseBtn.innerText = '回転再開';
                pauseBtn.classList.remove('playing');
            }
        });

        dimInput.addEventListener('input', () => {
            let val = parseInt(dimInput.value);
            if (isNaN(val) || val < 1) val = 1;

            if (val >= 8) {
                const result = confirm(`${val}次元立方体を描写しますか？（計算量が非常に多くなるため、お使いのPCによっては動作が重くなる可能性があります）`);
                if (result) {
                    currentDim = val;
                    previousDim = val;
                } else {
                    dimInput.value = previousDim;
                    return;
                }
            } else {
                currentDim = val;
                previousDim = val;
            }

            generateHypercube(currentDim);
        });

        generateHypercube(currentDim);
        animate();
    </script>
</body>
</html>
